  vision_feat_dim: 1536
  freeze_llm: true
  use_angle_tvi: false
  insert_time_tokens: true
  no_tanh_actions: true
  alpha_xy: 1.0
  text_max_length: 128
  use_agent_text_markers: true
  drone_target_verification_prompt: Compare all aerial-view person candidates using the target rule, history, and any valid start reference. The rule overrides a conflicting reference. For an appearance rule, match appearance; for an initial-target rule, preserve the first target identity. Score every candidate independently and accept only a sufficiently confident best match; ACT plans for the accepted target.
  dog_target_verification_prompt: Compare all ground-view person candidates using the target rule, history, and any valid start reference. The rule overrides a conflicting reference. For an appearance rule, match appearance; for an initial-target rule, preserve the first target identity. Score every candidate independently and accept only a sufficiently confident best match; ACT plans for the accepted target.
