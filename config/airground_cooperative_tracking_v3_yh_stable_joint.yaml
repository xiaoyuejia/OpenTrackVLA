  epochs: 10
  batch_size: 48
  grad_accum_steps: 2
  lr: 4.0e-5
  lr_scheduler: cosine
  warmup_steps: 300
  min_lr: 4.0e-6
  weight_decay: 0.01
  grad_clip: 1.0
  mixed_precision: true
  beta_nav: 100.0
  beta_cooperative_waypoint: 100.0
  beta_mode_classification: 1.0
  beta_jepa: 1.0
  beta_target_belief: 1.0
  beta_target_match: 1.0
