  coop_hidden_dim: 512
  coop_encoder_layers: 1
  coop_decoder_layers: 3
  coop_num_heads: 8
  coop_dropout: 0.0
  jepa_hidden_dim: 512
  jepa_decoder_layers: 3
  jepa_num_heads: 8
  jepa_dropout: 0.0
  jepa_momentum: 0.996
  detection_confidence_threshold: 0.25
  target_match_confidence_threshold: 0.50
  hard_visibility_routing: true
  pose_position_scale_m: 20.0
