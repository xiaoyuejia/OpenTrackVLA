version: 1
name: robotdog_single_realtime_gpu1
agent: robotdog

python_bin: /home/hdt/miniconda3/envs/omtracknew/bin/python
pipeline: sh/run_robotdog_single_agent_pipeline.sh

env:
  RUN_SPLIT: 0
  RUN_PROCESS: 0
  RUN_CACHE: 0
  RUN_TRAIN: 0
  RUN_EVAL: 1

  CKPT_DIR: /data/hdt/ntv_data/ckpt/robotdog_single_frozen_qwen_10ep
  MANIFEST: /data/hdt/ntv_data/sim_data/New_paths_training_multi_agent_split_10to1/split_manifest.json
  EVAL_ROOT: /data/hdt/ntv_data/sim_data/eval/single_agent_realtime_gpu1/robotdog
  EVAL_GPU: 6
  RENDER_GPU: 6

  EVAL_TARGET_REPLAY_MODE: path_goal
  EVAL_HUMAN_SPEED: 90
  EVAL_MAX_LOST_STEPS: 20
  EVAL_MAX_EPISODE_SECONDS: 0
  EVAL_MIN_SUCCESS_STEPS: 20
  EVAL_SUCCESS_RATE_THRESHOLD: 0.5
  EVAL_REQUIRE_SUCCESS_DISTANCE: 1

  EVAL_DT: 0.1
  EVAL_HISTORY_FRAME_DT: 0.1
  EVAL_FPS: 10
  EVAL_REALTIME_WAYPOINT_TIMING: 1
  EVAL_REALTIME_WAYPOINT_MIN_SECONDS: 0.1
  EVAL_REALTIME_WAYPOINT_MAX_SECONDS: 0.9
  EVAL_WAYPOINT_INDEX: 9
  EVAL_WAYPOINT_HORIZON_STEPS: 9

  EVAL_ROBOTDOG_MIN_FOLLOW_DIST: 4.5
  EVAL_ROBOTDOG_IDEAL_FOLLOW_DIST: 6.25
  EVAL_ROBOTDOG_MAX_FOLLOW_DIST: 8.0
  EVAL_ROBOTDOG_SUCCESS_DISTANCE: 8.0
  EVAL_ROBOTDOG_YAW_SIGN: 1.0
  EVAL_ROBOTDOG_YAW_SCALE: 1.0
  EVAL_SPEED_GAIN: 1.15
  EVAL_ROBOTDOG_MAX_SPEED: 1.05
  EVAL_ROBOTDOG_MAX_TURN_DEG: 30.0
  EVAL_ROBOTDOG_MAX_LATERAL_SPEED: 0.45
  EVAL_ROBOTDOG_MAX_YAW_RATE: 1.0

  EVAL_TARGET_GOAL_REACH_DISTANCE: 50
  EVAL_TARGET_STOP_WAIT_MIN_STEPS: 5
  EVAL_TARGET_STOP_WAIT_MAX_STEPS: 15
  EVAL_INIT_FROM_RECORDED_AGENT_POSE: 1
  EVAL_SETTLE_STEPS: 1
  EVAL_FLUSH_INITIAL_OBSERVATION: 1
  EVAL_REQUIRE_VISUAL_TARGET: 0
  EVAL_REQUIRE_CENTERED_TARGET: 0
  EVAL_USE_MASK_VISIBILITY: 1
  EVAL_MIN_VISIBLE_RATIO: 0.001
  EVAL_SNAP_HEADING: 0
  EVAL_FOLLOW_BEHIND: 1
  SAVE_EVAL_VIDEO: 1
  EVAL_FACE_TARGET_BEFORE_STEP: 0
  #CONFIG_PATH=/data/hdt/newtrackvla/config/eval_robotdog_single_realtime_gpu1.yaml \
  #bash sh/run_single_agent_eval_yaml.sh --overwrite
