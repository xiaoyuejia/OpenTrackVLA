version: 1
name: data3047_B_repaired_base_concat_conservative_time_aligned_drone_gain7_gpu1

python_bin: /home/hdt/miniconda3/envs/omtracknew/bin/python
pipeline: sh/run_multi_agent_eval.sh
parallel: false
comparison_dir: /data/hdt/ntv_data/sim_data/eval/data3047_B_repaired_base_concat_conservative_time_aligned_drone_gain7_gpu1/summary

common_env:
  EVAL_SCRIPT: eval_unrealzoo_multi_agent.py
  SPLIT_ROOT: /data/hdt/ntv_data/sim_data/data3047_split_150test_B_repaired
  TEST_TARGET_MANIFEST: /data/hdt/ntv_data/sim_data/data3047_split_150test_B_repaired/split_manifest.json
  EVAL_SCENES: ""
  EVAL_EPISODES: manifest
  EVAL_SEED: 100
  EVAL_MAX_STEPS: 600
  EVAL_MAX_LOST_STEPS: 20
  EVAL_MAX_FAILURE_STEPS: 0
  EVAL_FAILURE_WARMUP_STEPS: 20
  EVAL_MAX_EPISODE_SECONDS: 0
  EVAL_MIN_SUCCESS_STEPS: 20

  EVAL_TARGET_REPLAY_MODE: path_goal
  EVAL_TARGET_PATH_MIN_SPACING: 100
  EVAL_TARGET_PATH_REACH_DISTANCE: 120
  EVAL_TARGET_GOAL_REACH_DISTANCE: 50
  EVAL_TARGET_STOP_WAIT_MIN_STEPS: 5
  EVAL_TARGET_STOP_WAIT_MAX_STEPS: 15
  EVAL_INIT_FROM_RECORDED_AGENT_POSES: 1
  EVAL_INIT_FOLLOWERS_BEHIND_TARGET: 0
  # Default target speed is 0.9 m/s, matching the previous training data.
  # Optional choices: 1.0, 1.1, 1.2 m/s. If changed, update agent max-speed
  # overrides below or remove them so the shell pipeline derives matching values.
  EVAL_HUMAN_SPEED: 0.9
  EVAL_HUMAN_WAYPOINT_STALL_WINDOW: 20
  EVAL_HUMAN_WAYPOINT_STALL_DISTANCE: 20.0

  EVAL_DT: 0.1
  EVAL_FPS: 10
  EVAL_VISION_RESIZE_MODE: stretch
  # Repaired training samples use per-frame effective_dt_s with median ~= 1/3 s.
  # Keep simulator control at 0.1 s, but match model history and waypoint labels.
  EVAL_HISTORY_FRAME_DT: 0.333333
  EVAL_WAYPOINT_SOURCE_DT: 0.333333
  EVAL_DETERMINISTIC_STEP: 1
  EVAL_REALTIME_WAYPOINT_TIMING: 0
  EVAL_REALTIME_WAYPOINT_MIN_SECONDS: 0.1
  EVAL_REALTIME_WAYPOINT_MAX_SECONDS: 0.9
  EVAL_WAYPOINT_INDEX: 1
  EVAL_DRONE_WAYPOINT_INDEX: 1
  EVAL_ROBOTDOG_WAYPOINT_INDEX: 1
  EVAL_WAYPOINT_HORIZON_STEPS: 9

  EVAL_BBOX_SOURCE: none
  EVAL_REQUIRE_VISUAL_TARGET: 1
  EVAL_REQUIRE_CENTERED_TARGET: 0
  EVAL_USE_MASK_VISIBILITY: 1
  EVAL_MIN_VISIBLE_RATIO: 0.001

  EVAL_DRONE_MIN_FOLLOW_DIST: 3.0
  EVAL_DRONE_IDEAL_FOLLOW_DIST: 4.25
  EVAL_DRONE_MAX_FOLLOW_DIST: 5.5
  EVAL_DRONE_SUCCESS_DISTANCE: 5.5
  EVAL_DRONE_LOST_DISTANCE: 8.0
  # Preserve the previous effective Unreal action scale after changing
  # waypoint_source_dt from 0.1 s to 1/3 s.
  EVAL_DRONE_VX_SCALE: 7.0
  EVAL_DRONE_VY_SCALE: 7.0
  EVAL_DRONE_YAW_SIGN: 1.0
  EVAL_DRONE_YAW_SCALE: 3.33333
  EVAL_DRONE_MAX_SPEED: 1.20
  EVAL_DRONE_MAX_VX: 1.20
  EVAL_DRONE_MAX_VY: 0.60
  EVAL_DRONE_MAX_YAW_RATE: 0.4
  EVAL_DRONE_HEIGHT: 400

  EVAL_ROBOTDOG_MIN_FOLLOW_DIST: 4.5
  EVAL_ROBOTDOG_IDEAL_FOLLOW_DIST: 6.25
  EVAL_ROBOTDOG_MAX_FOLLOW_DIST: 8.0
  EVAL_ROBOTDOG_SUCCESS_DISTANCE: 8.0
  EVAL_ROBOTDOG_LOST_DISTANCE: 10.0
  EVAL_ROBOTDOG_YAW_SIGN: 1.0
  EVAL_ROBOTDOG_YAW_SCALE: 3.33333
  EVAL_ROBOTDOG_SPEED_GAIN: 3.33333
  EVAL_ROBOTDOG_MAX_SPEED: 1.2
  EVAL_ROBOTDOG_MAX_TURN_DEG: 30.0
  EVAL_ROBOTDOG_MAX_LATERAL_SPEED: 0.45
  EVAL_ROBOTDOG_MAX_YAW_RATE: 1.0
  EVAL_ROBOTDOG_CAMERA_FORWARD: 140.0
  EVAL_ROBOTDOG_CAMERA_LATERAL: 0.0
  EVAL_ROBOTDOG_CAMERA_HEIGHT: 110.0
  EVAL_ROBOTDOG_CAMERA_MOUNTS: "140:0:110,170:0:120,110:0:95,0:120:110,0:90:100,40:90:110,40:-90:110"
  EVAL_ROBOTDOG_CAMERA_PITCHES: "-15,-8,0,8,15,22,-22"
  EVAL_ROBOTDOG_CAMERA_YAW_OFFSETS: "0,-8,8,-15,15"
  EVAL_ROBOTDOG_CAMERA_MODE: fixed
  EVAL_ROBOTDOG_FOV: 95.0
  EVAL_MAX_SELF_VISIBLE_RATIO: 0.015

  EVAL_DRONE_CAMERA_FIXED_PITCH: -60
  EVAL_DRONE_CAMERA_PITCHES: "-60"
  EVAL_DRONE_CAMERA_FIXED_YAW: 0
  EVAL_DRONE_CAMERA_YAW_OFFSETS: "0"
  EVAL_DRONE_CAMERA_MODE: fixed
  EVAL_LOCK_DRONE_CAMERA_WORLD_XY: 1
  EVAL_DRONE_CAMERA_FORWARD_OFFSET: 35
  EVAL_DRONE_CAMERA_Z_OFFSET: -60
  EVAL_DRONE_FOV: 100

  EVAL_OFFSCREEN: 1
  EVAL_DISABLE_UE_INPUT: 1
  EVAL_TIME_DILATION: -1
  SAVE_EVAL_VIDEO: 1
  EVAL_WRITE_GLOBAL_VIDEO: 0
  EVAL_TRAJECTORY_OVERLAY: 1
  EVAL_PLANNER_DEBUG_STEPS: 10
  EVAL_EXTRA_ARGS: "--clip-translational-actions"
  EVAL_SNAP_HEADING: 0
  EVAL_FACE_TARGET_BEFORE_STEP: 0

models:
  - name: data3047_B_repaired_base_concat_conservative_best_time_aligned_drone_gain7
    checkpoint: /data/hdt/ntv_data/ckpt/data3047_B_repaired_base_concat_conservative_b32_acc4_lr2e-5/best_val.pt
    eval_root: /data/hdt/ntv_data/sim_data/eval/data3047_B_repaired_base_concat_conservative_time_aligned_drone_gain7_gpu1/best_val
    gpu: 1
    render_gpu: 1
    env:
      EVAL_INSTRUCTION: follow the person
      EVAL_JOINT_INSTRUCTION: follow the person
      EVAL_AGENT1_INSTRUCTION: ""
      EVAL_AGENT2_INSTRUCTION: ""
