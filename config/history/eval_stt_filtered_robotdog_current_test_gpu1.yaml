version: 1
name: stt_filtered_robotdog_habitat_style_current_test_gpu1
agent: robotdog

python_bin: /home/hdt/miniconda3/envs/omtracknew/bin/python
pipeline: sh/run_robotdog_single_agent_pipeline.sh

env:
  RUN_SPLIT: 0
  RUN_PROCESS: 0
  RUN_CACHE: 0
  RUN_TRAIN: 0
  RUN_EVAL: 1

  # Original single-agent STT checkpoint:
  # history=31, n_waypoints=10, alpha_xy=1, no_tanh_actions=True.
  CKPT_DIR: /data/hdt/ntv_data/ckpt/ckpt_stt_filtered

  # Current UnrealZoo test trajectories with Habitat STT-style evaluation.
  MANIFEST: /data/hdt/ntv_data/sim_data/New_paths_training_multi_agent_split_10to1/split_manifest.json
  EVAL_ROOT: /data/hdt/ntv_data/sim_data/eval/stt_filtered_robotdog_habitat_style_current_test_gpu1
  EVAL_GPU: 1
  RENDER_GPU: 1

  EVAL_TARGET_REPLAY_MODE: path_goal
  # Default target speed is 0.9 m/s. Optional choices: 1.0, 1.1, 1.2 m/s.
  # If changed, update agent max-speed overrides or remove them for shell defaults.
  EVAL_HUMAN_SPEED: 0.9
  EVAL_MAX_STEPS: 300
  # Original evaluator breaks after distance > 4 m for more than 20 counts.
  EVAL_MAX_LOST_STEPS: 21
  EVAL_MAX_EPISODE_SECONDS: 0
  EVAL_MIN_SUCCESS_STEPS: 1
  # Habitat records following_rate separately; binary success checks the final state.
  EVAL_SUCCESS_RATE_THRESHOLD: 0.0
  EVAL_REQUIRE_SUCCESS_DISTANCE: 1

  EVAL_DT: 0.1
  EVAL_HISTORY_FRAME_DT: 0.1
  EVAL_FPS: 10
  # Habitat always executes waypoint[1] / 0.1 s, independent of inference latency.
  EVAL_REALTIME_WAYPOINT_TIMING: 0
  EVAL_REALTIME_WAYPOINT_MIN_SECONDS: 0.1
  EVAL_REALTIME_WAYPOINT_MAX_SECONDS: 0.9
  EVAL_WAYPOINT_INDEX: 1
  EVAL_WAYPOINT_HORIZON_STEPS: 9
  EVAL_EXTRA_ARGS: "--history-sampling-mode inference_steps --require-final-follow-range-on-target-stop"

  # Habitat human_following: visible and distance <= 3 m.
  # human_following_success uses the [1, 3] m interval.
  EVAL_ROBOTDOG_MIN_FOLLOW_DIST: 1.0
  EVAL_ROBOTDOG_IDEAL_FOLLOW_DIST: 2.0
  EVAL_ROBOTDOG_MAX_FOLLOW_DIST: 3.0
  EVAL_ROBOTDOG_SUCCESS_DISTANCE: 3.0
  EVAL_ROBOTDOG_LOST_DISTANCE: 4.0
  EVAL_ROBOTDOG_YAW_SIGN: 1.0
  EVAL_ROBOTDOG_YAW_SCALE: 1.0
  EVAL_SPEED_GAIN: 1.0
  EVAL_ROBOTDOG_MAX_SPEED: 1.20
  EVAL_ROBOTDOG_MAX_TURN_DEG: 360.0
  EVAL_ROBOTDOG_MAX_LATERAL_SPEED: 10.0
  EVAL_ROBOTDOG_MAX_YAW_RATE: 6.28

  EVAL_TARGET_GOAL_REACH_DISTANCE: 50
  EVAL_TARGET_STOP_WAIT_MIN_STEPS: 0
  EVAL_TARGET_STOP_WAIT_MAX_STEPS: 0
  EVAL_INIT_FROM_RECORDED_AGENT_POSE: 1
  EVAL_SETTLE_STEPS: 1
  EVAL_FLUSH_INITIAL_OBSERVATION: 1
  # Habitat facing threshold: 3000 target pixels at 640x480.
  EVAL_REQUIRE_VISUAL_TARGET: 1
  EVAL_REQUIRE_CENTERED_TARGET: 0
  EVAL_USE_MASK_VISIBILITY: 1
  EVAL_MIN_VISIBLE_RATIO: 0.009765625
  EVAL_SNAP_HEADING: 0
  EVAL_FOLLOW_BEHIND: 1
  EVAL_FACE_TARGET_BEFORE_STEP: 0
  SAVE_EVAL_VIDEO: 1
