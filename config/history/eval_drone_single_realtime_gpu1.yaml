version: 1
name: drone_single_realtime_gpu1
agent: drone

python_bin: /home/hdt/miniconda3/envs/omtracknew/bin/python
pipeline: sh/run_drone_single_agent_pipeline.sh

env:
  RUN_ORGANIZE: 0
  RUN_SPLIT: 0
  RUN_PROCESS: 0
  RUN_CACHE: 0
  RUN_TRAIN: 0
  RUN_EVAL: 1

  CKPT_DIR: /data/hdt/ntv_data/ckpt/New_paths_training_drone_single_frozen_qwen_10ep
  MANIFEST: /data/hdt/ntv_data/sim_data/New_paths_training_multi_agent_split_10to1/split_manifest.json
  EVAL_ROOT: /data/hdt/ntv_data/sim_data/eval/single_agent_realtime_gpu1/drone
  EVAL_GPU: 6
  RENDER_GPU: 1

  EVAL_TARGET_REPLAY_MODE: path_goal
  EVAL_TARGET_PATH_MIN_SPACING: 100
  EVAL_TARGET_PATH_REACH_DISTANCE: 120
  EVAL_TARGET_GOAL_REACH_DISTANCE: 50
  EVAL_TARGET_STOP_WAIT_MIN_STEPS: 0
  EVAL_TARGET_STOP_WAIT_MAX_STEPS: 0
  # Default target speed is 0.9 m/s. Optional choices: 1.0, 1.1, 1.2 m/s.
  # If changed, update agent max-speed overrides or remove them for shell defaults.
  EVAL_HUMAN_SPEED: 0.9
  EVAL_MAX_LOST_STEPS: 20
  EVAL_MAX_EPISODE_SECONDS: 0
  EVAL_MIN_SUCCESS_STEPS: 20
  EVAL_SUCCESS_RATE_THRESHOLD: 0.5
  EVAL_REQUIRE_SUCCESS_DISTANCE: 1

  EVAL_DT: 0.1
  EVAL_HISTORY_FRAME_DT: 0.1
  EVAL_FPS: 10
  EVAL_DETERMINISTIC_STEP: 0
  # Realtime evaluation: UE keeps running during inference, and the command
  # waypoint is selected from the measured observation interval.
  EVAL_REALTIME_WAYPOINT_TIMING: 1
  EVAL_REALTIME_WAYPOINT_MIN_SECONDS: 0.1
  EVAL_REALTIME_WAYPOINT_MAX_SECONDS: 0.9
  EVAL_WAYPOINT_INDEX: 9
  EVAL_WAYPOINT_HORIZON_STEPS: 9

  EVAL_DRONE_MIN_FOLLOW_DIST: 2.5
  EVAL_DRONE_IDEAL_FOLLOW_DIST: 4.5
  EVAL_DRONE_MAX_FOLLOW_DIST: 6.5
  EVAL_DRONE_SUCCESS_DISTANCE: 6.5
  EVAL_DRONE_VX_SCALE: 0.1
  EVAL_DRONE_VY_SCALE: 0.1
  EVAL_DRONE_YAW_SIGN: 1.0
  # Autonomous yaw evaluation: no simulator-side target facing.
  EVAL_DRONE_YAW_SCALE: 0.8
  EVAL_DRONE_MAX_SPEED: 1.20
  EVAL_DRONE_MAX_VX: 1.20
  EVAL_DRONE_MAX_VY: 0.60
  EVAL_DRONE_MAX_YAW_RATE: 0.8
  EVAL_DRONE_HEIGHT: 600

  EVAL_INIT_FROM_RECORDED_AGENT_POSE: 0
  EVAL_INIT_FOLLOWERS_BEHIND_TARGET: 1
  EVAL_REQUIRE_VISUAL_TARGET: 1
  EVAL_REQUIRE_CENTERED_TARGET: 0
  EVAL_USE_MASK_VISIBILITY: 1
  EVAL_MIN_VISIBLE_RATIO: 0.001
  EVAL_SNAP_HEADING: 0
  EVAL_FOLLOW_BEHIND: 1
  EVAL_FACE_TARGET_BEFORE_STEP: 0
  SAVE_EVAL_VIDEO: 1
# CONFIG_PATH=/data/hdt/newtrackvla/config/eval_drone_single_realtime_gpu1.yaml \
# bash sh/run_single_agent_eval_yaml.sh --overwrite
