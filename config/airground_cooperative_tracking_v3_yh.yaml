architecture: airground_three_stream_cooperative_v3
data:
  train_json: /data/yh/data/processed/train_jsonl
  val_json: null
  cache_root: /data/yh/data/processed/vision_cache
  val_cache_root: null
  perception_cache_root: /data/yh/data/processed/perception_cache
  candidate_cache_root: /data/yh/data/processed/perception_cache
  require_topk_candidate_cache: true
  candidate_top_k: 8
  train_episodes_manifest: /data/yh/data/manifests/train_joint.json
  val_episodes_manifest: /data/yh/data/manifests/val_joint.json
  expected_train_episodes: 9480
  expected_val_episodes: 2400
  history: 31
  n_waypoints: 8
  action_dims: 3
  image_size: 384
  vision_resize_mode: letterbox
  online_encode_missing: false
  allow_missing_perception_cache: false
  target_match_iou_threshold: 0.30
  # Shared STT/DT/AT reference dropout keeps instruction grounding necessary.
  train_target_reference_dropout_prob: 0.20
  val_target_reference_dropout_prob: 0.0
  # Top-K already supplies real distractors. The legacy augmentation only
  # replaced detection_feat/top-1 and incorrectly removed SELF supervision.
  train_synthetic_false_positive_prob: 0.0
  val_synthetic_false_positive_prob: 0.0
  # Each episode uses a randomized offset permutation. Five epochs at stride 5
  # cover every recorded frame once without synchronizing all episode phases.
  train_temporal_stride: 5
  coarse_cache_size: 8192
  # Shuffle short episode-local micro-blocks globally. With batch 40, five
  # independently shuffled 8-sample blocks naturally mix STT/DT/AT while
  # preserving history-token locality inside each block.
  shuffle_block_size: 8
  train_synthetic_drone_occlusion_prob: 0.50
  train_synthetic_dog_occlusion_prob: 0.50
  val_synthetic_drone_occlusion_prob: 0.50
  val_synthetic_dog_occlusion_prob: 0.50
  occlusion_seed: 731
model:
  llm_name: /data/yh/newtrackvla修改/newtrackvla_base_yh_clean/models/qwen3-0.6b
  vision_feat_dim: 1536
  freeze_llm: true
  use_angle_tvi: false
  insert_time_tokens: true
  no_tanh_actions: true
  alpha_xy: 1.0
  text_max_length: 128
  use_agent_text_markers: true
  drone_target_verification_prompt: Compare all aerial-view person candidates using the target rule, history, and any valid start reference. The rule overrides a conflicting reference. For an appearance rule, match appearance; for an initial-target rule, preserve the first target identity. Score every candidate independently and accept only a sufficiently confident best match; ACT plans for the accepted target.
  dog_target_verification_prompt: Compare all ground-view person candidates using the target rule, history, and any valid start reference. The rule overrides a conflicting reference. For an appearance rule, match appearance; for an initial-target rule, preserve the first target identity. Score every candidate independently and accept only a sufficiently confident best match; ACT plans for the accepted target.
  num_modes: 4
  coop_hidden_dim: 512
  coop_encoder_layers: 1
  coop_decoder_layers: 3
  coop_num_heads: 8
  coop_dropout: 0.0
  jepa_hidden_dim: 512
  jepa_decoder_layers: 3
  jepa_num_heads: 8
  jepa_dropout: 0.0
  jepa_momentum: 0.996
  detection_confidence_threshold: 0.25
  target_match_confidence_threshold: 0.50
  hard_visibility_routing: true
  pose_position_scale_m: 20.0
optimization:
  out_dir: /data/yh/newtrackvla修改/newtrackvla_base_yh_clean/output/airground_v3_pro6000_joint
  epochs: 10
  # Batch 48 uses the available ~90 GiB/GPU; effective global batch=192.
  batch_size: 48
  grad_accum_steps: 2
  # Effective global batch is 48*2 GPUs*2 accumulation=192.
  lr: 4.0e-5
  lr_scheduler: cosine
  warmup_steps: 300
  min_lr: 4.0e-6
  weight_decay: 0.01
  grad_clip: 1.0
  mixed_precision: true
  beta_nav: 100.0
  beta_cooperative_waypoint: 100.0
  beta_mode_classification: 1.0
  beta_jepa: 1.0
  beta_target_belief: 1.0
  beta_target_match: 1.0
  beta_uncertainty: 0.1
  beta_smoothness: 0.1
  beta_kinematics: 0.1
  beta_diversity: 0.1
  beta_obstacle: 0.0
  enable_projected_obstacle_loss: false
runtime:
  distributed: true
  dist_backend: nccl
  num_workers: 8
  prefetch_factor: 3
  seed: 731
  log_every: 1
  csv_logging: true
  progress: true
  compact_terminal_log: true
  save_every: 0
  save_every_epochs: 1
  max_ckpts: 3
  eval_every: 1000
  eval_batches: 16
  resume: false
  init_ckpt: /data/yh/ckpt/model_epoch009_step064125_final.pt
